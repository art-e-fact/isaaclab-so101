name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no moving major tag)
      - run: uvx ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Without lerobot the recorder test skips; with it, everything runs.
        extras: ["dev", "dev,lerobot,leader"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no moving major tag)
        with:
          python-version: "3.12"
          activate-environment: true
      # CPU torch: the tests stub Isaac Sim / Lab / Arena and need no GPU.
      - run: uv pip install --torch-backend cpu -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -rs
