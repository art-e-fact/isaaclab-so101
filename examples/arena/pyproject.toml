[project]
name = "arena-so101-examples"
version = "0.0.0"
description = "Run the SO-101 embodiments in Isaac Lab Arena, installed by uv alone."
requires-python = "==3.12.*"
dependencies = [
    "arena-so101[leader]",
    "isaaclab-arena",
    # The rest mirrors Arena's `isaaclab-from-wheel` dependency group at the pinned commit.
    "isaaclab[isaacsim,all]==3.0.0b2",
    "rsl-rl-lib==5.0.1",
    "daqp==0.8.5",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    # Not in Arena's wheel group, but Arena's teleop script needs it: its from-source group gets it
    # through isaaclab-teleop, with this pin.
    "isaacteleop[retargeters,ui,cloudxr]~=1.3.0",
]

[tool.uv]
package = false
# Everything below is copied from Arena's pyproject.toml at the pinned commit: a dependency's
# [tool.uv] settings don't apply to the project that depends on it. Update it with the `rev`.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "if-necessary-or-explicit"
index-strategy = "first-index"
override-dependencies = [
    "numpy==2.3.1",
    "coverage==7.4.4",
    "packaging==26.0",
    "websockets==16.1.1",
    # Not from Arena: lerobot (the `leader` extra) needs huggingface-hub>=1.6, which Isaac Lab's
    # transformers==4.57.6 pin rules out. Isaac Lab imports transformers lazily, for one optional
    # observation term; this is lerobot's own range.
    "transformers>=5.4,<5.6",
]
constraint-dependencies = ["pin-pink==3.1.0", "pyglet<3", "tinyobjloader==2.0.0rc13", "mujoco-usd-converter==0.2.0"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
arena-so101 = { path = "../..", editable = true }
# arena-shape-sorting runs this Arena commit. Arena dropped its Isaac Lab wheel install on 2026-09-03
# (3e60147); a newer rev needs Isaac Lab from git instead, see README.
isaaclab-arena = { git = "https://github.com/isaac-sim/IsaacLab-Arena.git", rev = "4607c27bd7ac2f8ab2f449e1e2c65989b064af79" }
mujoco-usd-converter = { index = "pypi" }
isaacteleop = { index = "pypi" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
