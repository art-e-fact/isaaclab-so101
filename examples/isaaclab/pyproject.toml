[project]
name = "isaaclab-so101-examples"
version = "0.0.0"
description = "Run the SO-101 in plain Isaac Lab (no Arena), installed by uv alone."
requires-python = "==3.12.*"
dependencies = [
    "isaaclab-so101",
    "isaaclab[isaacsim,all,video]==3.0.0",  # video: `isaaclab play --video` records clips headless
]

# Isaac Lab's CLI (`isaaclab train/play`) imports the modules in this group, which register their tasks.
[project.entry-points."isaaclab.tasks"]
so101_reach = "so101_reach"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["so101_reach"]

# What the Isaac Lab wheel's own dependencies leave out. Update these with the isaaclab pin.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "if-necessary-or-explicit"
index-strategy = "first-index"
# Isaac Lab's tools/wheel_builder/uv-overrides.txt, as is: isaacsim-core pins older or narrower versions of these.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]
constraint-dependencies = [
    # Pinned by isaacsim-core. Only PyPI has this version, and a source applies only to a named requirement.
    "mujoco-usd-converter==0.6.1",
    # Pinned by isaacsim-core; a pre-release, which uv takes only when named.
    "tinyobjloader==2.0.0rc13",
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"

# torch comes from here too: PyPI's x86_64 builds are CUDA 13.0, the build Isaac Lab 3.0 targets.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
isaaclab-so101 = { path = "../..", editable = true }
mujoco-usd-converter = { index = "pypi" }
