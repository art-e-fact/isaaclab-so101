[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-so101"
version = "0.1.0"
description = "SO-101 embodiment and leader teleop for Isaac Lab Arena"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
requires-python = ">=3.10"
dependencies = [
    "lerobot[dataset,training]",
]

[project.optional-dependencies]
leader = ["lerobot[feetech]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena_so101 = [
    "embodiments/data/*.usd",
    "embodiments/data/*.usda",
    "embodiments/data/curobo/**/*",
    "lerobot/*",
]
